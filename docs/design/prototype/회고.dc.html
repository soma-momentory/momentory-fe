<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
body{margin:0;background:#E6E1D6;font-family:'Pretendard',-apple-system,sans-serif}
a{color:#8C9A76;text-decoration:none}a:hover{color:#6E7B5C}
input{font-family:'Pretendard',sans-serif}
@keyframes riseIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dotPulse{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div style="position:relative;width:390px;height:803px;border-radius:46px;background:#161512;padding:5px;box-sizing:border-box;box-shadow:0 30px 70px rgba(60,56,48,.3)">
<div style="position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#F7F4ED;display:flex;flex-direction:column">

  <div style="position:absolute;left:0;right:0;bottom:0;height:436px;z-index:0">
    <div style="position:absolute;left:-20%;top:0;width:140%;height:78px;background:#C7D3C0;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
    <div style="position:absolute;left:0;right:0;top:38px;bottom:0;background:#C7D3C0"></div>
  </div>
  <div style="position:absolute;left:8px;bottom:52px;width:192px;z-index:0">
    <img src="assets/capybara2-trim.png" alt="카피바라" style="width:100%;display:block;opacity:.95;animation:bob 5s ease-in-out infinite"></img>
  </div>

  <div style="position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 2px;font-size:12px;color:#9AA8AD;flex:none">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center">
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block;opacity:.4"></span>
    </span>
  </div>

  <div style="position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column">

    <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px">
      <a href="홈.dc.html" style="font-size:19px;color:#3C3830;line-height:1;padding:4px 4px">←</a>
      <span style="font-size:16px;color:#7D8A86;padding:4px 4px">☀︎</span>
    </div>

    <div ref="{{ chatRef }}" style="flex:1;min-height:0;overflow-y:auto;padding:4px 18px {{ chatPadBottom }};display:flex;flex-direction:column;gap:9px;transition:padding-bottom .24s ease">
      <sc-for list="{{ messages }}" as="m" hint-placeholder-count="3">
        <div style="flex:none;align-self:{{ m.align }};max-width:{{ m.max }};background:{{ m.bg }};color:{{ m.color }};border-radius:{{ m.radius }};padding:12px 14px;font-size:14px;line-height:1.6;letter-spacing:-.2px;box-shadow:0 1px 4px rgba(0,0,0,.05);animation:msgIn .34s cubic-bezier(.3,.9,.3,1);word-break:keep-all">{{ m.text }}</div>
      </sc-for>
      <sc-if value="{{ isTyping }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;align-self:flex-start;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.85);border-radius:14px 14px 14px 4px;padding:14px 15px;box-shadow:0 1px 4px rgba(0,0,0,.05);animation:msgIn .3s cubic-bezier(.3,.9,.3,1)">
          <span style="width:6px;height:6px;border-radius:50%;background:#B9B2A2;animation:dotPulse 1.1s ease-in-out infinite"></span>
          <span style="width:6px;height:6px;border-radius:50%;background:#B9B2A2;animation:dotPulse 1.1s ease-in-out .18s infinite"></span>
          <span style="width:6px;height:6px;border-radius:50%;background:#B9B2A2;animation:dotPulse 1.1s ease-in-out .36s infinite"></span>
        </div>
      </sc-if>
    </div>

    <sc-if value="{{ isTextStep }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;right:0;bottom:{{ dockBottom }};z-index:3;display:flex;align-items:center;gap:9px;padding:10px 14px 18px;transition:bottom .22s cubic-bezier(.3,.9,.3,1)">
        <div onClick="{{ openKeyboard }}" style="flex:1;min-width:0;display:flex;align-items:center;background:rgba(255,255,255,.9);border:1.5px solid {{ inputBorder }};border-radius:20px;padding:11px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:border-color .18s ease">
          <input ref="{{ inputRef }}" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKeyDown }}" placeholder="{{ placeholder }}" style="flex:1;border:none;outline:none;background:transparent;font-size:14px;color:#3C3830;min-width:0"></input>
        </div>
        <button onClick="{{ sendText }}" style="flex:none;width:42px;height:42px;border-radius:50%;border:none;background:{{ sendBg }};color:#fff;font-size:17px;cursor:pointer;transition:background .18s ease">↑</button>
      </div>
    </sc-if>

    <sc-if value="{{ isSliderStep }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:14px;right:14px;bottom:18px;z-index:3;background:#FDFBF5;border-radius:18px;padding:18px 18px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:11px;animation:cardIn .3s cubic-bezier(.3,.9,.3,1)">
        <div style="text-align:center;font-family:'Pretendard',sans-serif;font-weight:700;font-size:26px;line-height:1;color:#3C3830">{{ score }}</div>
        <div ref="{{ trackRef }}" onPointerDown="{{ onTrackDown }}" style="position:relative;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none">
          <div style="position:absolute;left:0;right:0;height:5px;border-radius:3px;background:#E7E1D2"></div>
          <div style="position:absolute;left:0;height:5px;border-radius:3px;background:#8FA28A;width:{{ fillW }}"></div>
          <div style="position:absolute;left:{{ thumbLeft }};width:22px;height:22px;border-radius:50%;background:#fff;border:1.5px solid #8FA28A;box-shadow:0 1px 4px rgba(0,0,0,.1)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#B9B2A2">
          <span>전혀 아니다</span><span>매우 그렇다</span>
        </div>
        <button onClick="{{ sendScore }}" style="align-self:flex-end;border:1.5px solid #8C9A76;background:#fff;border-radius:16px;padding:8px 18px;font-family:'Pretendard',sans-serif;font-weight:700;font-size:16px;color:#3C3830;cursor:pointer" style-hover="background:#F2F0E6">이 정도예요</button>
      </div>
    </sc-if>

    <sc-if value="{{ isChoiceStep }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:14px;right:14px;bottom:18px;z-index:3;background:#FDFBF5;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.06);animation:cardIn .3s cubic-bezier(.3,.9,.3,1)">
        <sc-for list="{{ choices }}" as="c" hint-placeholder-count="3">
          <button onClick="{{ c.pick }}" style="width:100%;text-align:left;border:1.5px solid #C3C1B6;background:#fff;border-radius:18px;padding:12px 16px;font-family:'Pretendard',sans-serif;font-size:14px;color:#3C3830;cursor:pointer" style-hover="background:#F2F0E6;border-color:#8C9A76">{{ c.label }}</button>
        </sc-for>
        <button onClick="{{ pickCustom }}" style="width:100%;text-align:left;border:1.5px dashed #B9B2A2;background:rgba(255,255,255,.6);border-radius:18px;padding:12px 16px;font-family:'Pretendard',sans-serif;font-size:14px;color:#8F9A83;cursor:pointer" style-hover="background:#F2F0E6">직접 쓸래요</button>
      </div>
    </sc-if>

    <div onClick="{{ dismissKb }}" style="position:absolute;inset:0;z-index:3;background:transparent;pointer-events:{{ kbPointer }}"></div>

    <div style="position:absolute;left:0;right:0;bottom:0;z-index:4;height:262px;background:#CFC9BB;padding:8px 5px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:7px;transform:translateY({{ kbY }});pointer-events:{{ kbPointer }};transition:transform .3s cubic-bezier(.3,.9,.3,1)">
        <sc-for list="{{ keyRows }}" as="row" hint-placeholder-count="4">
          <div style="display:flex;gap:5px;padding:0 {{ row.pad }};flex:1">
            <sc-for list="{{ row.keys }}" as="k" hint-placeholder-count="10">
              <button onClick="{{ k.press }}" style="flex:{{ k.f }};min-width:0;border:none;border-radius:5px;background:{{ k.bg }};color:{{ k.color }};font-family:'Pretendard',sans-serif;font-size:{{ k.size }};box-shadow:0 1px 0 rgba(0,0,0,.18);cursor:pointer;padding:0" style-active="transform:translateY(1px)">{{ k.label }}</button>
            </sc-for>
          </div>
        </sc-for>
      </div>

  </div>

</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:924},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;지현&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;moodLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;행복한&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_COMBO={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const JONG_COMBO={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JONG_SPLIT={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const JUNG_SPLIT={'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
const isSyl=c=>c>='가'&&c<='힣';
const decomp=c=>{const n=c.charCodeAt(0)-44032;return{c:CHO[Math.floor(n/588)],v:JUNG[Math.floor((n%588)/28)],t:JONG[n%28]};};
const comp=(c,v,t)=>String.fromCharCode(44032+CHO.indexOf(c)*588+JUNG.indexOf(v)*28+JONG.indexOf(t||''));
const K1=['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'];
const K1S=['ㅃ','ㅉ','ㄸ','ㄲ','ㅆ','ㅛ','ㅕ','ㅑ','ㅒ','ㅖ'];
const K2=['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'];
const K3=['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ'];

class Component extends DCLogic {
  state={step:0,messages:[],draft:'',kbOpen:false,shift:false,score:7,custom:false,awaiting:true,done:false,mode:'ko'};
  inputRef=React.createRef();
  chatRef=React.createRef();
  trackRef=React.createRef();

  steps(){
    const name=this.props.userName??'지현';
    return [
      {type:'text',asks:[name+'님, 지금은 '+(this.props.moodLabel??'행복한')+' 마음이 가장 가까이 있군요.','오늘은 어떤 이야기를 나누고 싶어요? 일정에 없던 일이나 지금 떠오른 생각도 괜찮아요.'],placeholder:'편하게 이야기해주세요'},
      {type:'slider',asks:['오늘 하루는 얼마나 만족스러웠나요?']},
      {type:'choice',asks:['내일의 나에게 무엇이 가장 도움이 될까요?'],options:['충분히 쉬기','할 일을 하나만 줄이기','누군가와 이야기하기'],placeholder:'하고 싶은 말을 적어주세요'}
    ];
  }

  componentDidMount(){this.ask(0);}
  componentDidUpdate(_,prev){
    if(prev.messages!==this.state.messages||prev.awaiting!==this.state.awaiting){
      const el=this.chatRef.current;
      if(el)requestAnimationFrame(()=>{el.scrollTo({top:el.scrollHeight,behavior:'smooth'});});
    }
  }

  ask=(i)=>{
    const st=this.steps()[i];if(!st)return;
    st.asks.forEach((text,k)=>{
      setTimeout(()=>this.setState(s=>({messages:[...s.messages,{role:'bot',text}]})),k*540);
    });
    setTimeout(()=>this.setState({awaiting:false}),(st.asks.length-1)*540+460);
  };

  reply=(text)=>{
    const next=this.state.step+1;
    this.setState(s=>({messages:[...s.messages,{role:'me',text}],draft:'',kbOpen:false,custom:false,awaiting:true}));
    setTimeout(()=>{
      if(next>=this.steps().length){
        this.setState(s=>({done:true,messages:[...s.messages,{role:'bot',text:'오늘 이야기 고마워요. 일기로 정리해 볼게요.'}]}));
        setTimeout(()=>{window.location.href='일기.dc.html';},1100);
      }else{this.setState({step:next});this.ask(next);}
    },700);
  };

  openKeyboard=()=>this.setState({kbOpen:true});
  onDraft=(ev)=>this.setState({draft:ev.target.value});
  onKeyDown=(ev)=>{if(ev.key==='Enter'){ev.preventDefault();this.sendText();}};
  sendText=()=>{const v=this.state.draft.trim();if(v)this.reply(v);};
  sendScore=()=>this.reply('오늘은 '+this.state.score+'점 정도예요');
  pickChoice=(label)=>this.reply(label);
  pickCustom=()=>this.setState({custom:true,kbOpen:true,draft:''},()=>{const el=this.inputRef.current;if(el)el.focus();});
  dismissKb=()=>{const el=this.inputRef.current;if(el)el.blur();this.setState({kbOpen:false,shift:false});};
  setMode=(m)=>this.setState({mode:m,shift:false});

  insertJamo=(j)=>{
    const s=this.state.draft;const last=s.slice(-1);const head=s.slice(0,-1);
    const isC=CHO.indexOf(j)>=0||JONG.indexOf(j)>0;const isV=JUNG.indexOf(j)>=0;
    let out;
    if(isV){
      if(isSyl(last)){
        const d=decomp(last);
        if(d.t){
          const sp=JONG_SPLIT[d.t];
          if(sp)out=head+comp(d.c,d.v,sp[0])+comp(sp[1],j,'');
          else out=head+comp(d.c,d.v,'')+comp(d.t,j,'');
        }else{
          const cb=JUNG_COMBO[d.v+j];
          out=cb?head+comp(d.c,cb,d.t):s+j;
        }
      }else if(CHO.indexOf(last)>=0){out=head+comp(last,j,'');}
      else if(JUNG.indexOf(last)>=0&&JUNG_COMBO[last+j]){out=head+JUNG_COMBO[last+j];}
      else out=s+j;
    }else if(isC){
      if(isSyl(last)){
        const d=decomp(last);
        if(!d.t&&JONG.indexOf(j)>0)out=head+comp(d.c,d.v,j);
        else if(d.t&&JONG_COMBO[d.t+j])out=head+comp(d.c,d.v,JONG_COMBO[d.t+j]);
        else out=s+j;
      }else out=s+j;
    }else out=s+j;
    this.setState({draft:out,shift:false});
  };
  backspace=()=>{
    const s=this.state.draft;if(!s)return;const last=s.slice(-1);const head=s.slice(0,-1);
    if(isSyl(last)){
      const d=decomp(last);
      if(d.t){const sp=JONG_SPLIT[d.t];this.setState({draft:head+comp(d.c,d.v,sp?sp[0]:'')});}
      else{const sp=JUNG_SPLIT[d.v];this.setState({draft:head+(sp?comp(d.c,sp[0],''):d.c)});}
    }else this.setState({draft:head});
  };

  setScore=(e)=>{
    const el=this.trackRef.current;if(!el)return;
    const r=el.getBoundingClientRect();
    const ratio=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
    this.setState({score:Math.round(ratio*10)});
  };
  onTrackDown=(ev)=>{
    ev.preventDefault();this.setScore(ev);
    const move=(e)=>this.setScore(e);
    const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
  };

  renderVals(){
    const s=this.state;
    const st=this.steps()[s.step]||{};
    const typing=st.type==='text'||(st.type==='choice'&&s.custom);
    const mk=(label,f,bg,color,size,press)=>({label,f,bg:bg||'#FFFFFF',color:color||'#2B2B2B',size:size||'15px',press});
    const G='#EDEAE0';
    const put=(ch)=>()=>this.setState(p=>({draft:p.draft+ch,shift:false}));
    const bottom=(a,b)=>[mk(a[0],1.4,G,'#2B2B2B','12px',a[1]),mk(b[0],1.4,G,'#2B2B2B','12px',b[1]),
      mk('',4.6,null,null,null,put(' ')),mk('.',1,null,null,null,put('.')),
      mk('전송',1.8,'#8FA28A','#fff','14px',this.sendText)];
    let rows;
    if(s.mode==='sym'){
      rows=[
        '1234567890'.split('').map(c=>mk(c,1,null,null,null,put(c))),
        ['-','/',':',';','(',')','₩','&','@','"'].map(c=>mk(c,1,null,null,null,put(c))),
        [mk('#+=',1.4,G,'#2B2B2B','12px',()=>this.setMode('sym2'))].concat(['.',',','?','!','\''].map(c=>mk(c,1.2,null,null,null,put(c)))).concat([mk('⌫',1.4,G,'#2B2B2B','14px',this.backspace)]),
        bottom(['한글',()=>this.setMode('ko')],['ABC',()=>this.setMode('en')])
      ];
    }else if(s.mode==='sym2'){
      rows=[
        ['[',']','{','}','#','%','^','*','+','='].map(c=>mk(c,1,null,null,null,put(c))),
        ['_','\\','|','~','<','>','$','€','¥','•'].map(c=>mk(c,1,null,null,null,put(c))),
        [mk('123',1.4,G,'#2B2B2B','12px',()=>this.setMode('sym'))].concat(['.',',','?','!','\''].map(c=>mk(c,1.2,null,null,null,put(c)))).concat([mk('⌫',1.4,G,'#2B2B2B','14px',this.backspace)]),
        bottom(['한글',()=>this.setMode('ko')],['ABC',()=>this.setMode('en')])
      ];
    }else if(s.mode==='en'){
      const up=s.shift;
      const m=c=>{const ch=up?c.toUpperCase():c;return mk(ch,1,null,null,null,put(ch));};
      rows=[
        'qwertyuiop'.split('').map(m),
        'asdfghjkl'.split('').map(m),
        [mk('⇧',1.4,up?'#8FA28A':G,up?'#fff':'#2B2B2B','14px',()=>this.setState(p=>({shift:!p.shift})))]
          .concat('zxcvbnm'.split('').map(m))
          .concat([mk('⌫',1.4,G,'#2B2B2B','14px',this.backspace)]),
        bottom(['!#1',()=>this.setMode('sym')],['한/영',()=>this.setMode('ko')])
      ];
    }else{
      rows=[
        (s.shift?K1S:K1).map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))),
        K2.map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))),
        [mk('⇧',1.4,s.shift?'#8FA28A':G,s.shift?'#fff':'#2B2B2B','14px',()=>this.setState(p=>({shift:!p.shift})))]
          .concat(K3.map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))))
          .concat([mk('⌫',1.4,G,'#2B2B2B','14px',this.backspace)]),
        bottom(['!#1',()=>this.setMode('sym')],['한/영',()=>this.setMode('en')])
      ];
    }
    const dockH=typing?(s.kbOpen?350:88):(st.type==='slider'?210:268);

    return {
      messages:s.messages.map(m=>({
        text:m.text,
        align:m.role==='me'?'flex-end':'flex-start',
        max:m.role==='me'?'76%':'84%',
        bg:m.role==='me'?'#3C3830':'rgba(255,255,255,.85)',
        color:m.role==='me'?'#F7F4ED':'#3C3830',
        radius:m.role==='me'?'14px 14px 4px 14px':'14px 14px 14px 4px'
      })),
      chatRef:this.chatRef, isTyping:s.awaiting&&!s.done,
      chatPadBottom:(s.done?24:dockH)+'px',
      isTextStep:typing&&!s.awaiting&&!s.done,
      isSliderStep:st.type==='slider'&&!s.custom&&!s.awaiting&&!s.done,
      isChoiceStep:st.type==='choice'&&!s.custom&&!s.awaiting&&!s.done,
      placeholder:st.placeholder||'', draft:s.draft, inputRef:this.inputRef,
      onDraft:this.onDraft, onKeyDown:this.onKeyDown, sendText:this.sendText, openKeyboard:this.openKeyboard,
      sendBg:s.draft.trim()?'#8FA28A':'#B7BDAE',
      inputBorder:s.kbOpen?'#8C9A76':'transparent',
      dockBottom:s.kbOpen?'262px':'0px',
      kbOpen:s.kbOpen, kbY:s.kbOpen?'0%':'100%', kbPointer:s.kbOpen?'auto':'none', dismissKb:this.dismissKb,
      keyRows:rows.map((k,i)=>({keys:k,pad:i===1?'14px':'0px'})),
      score:s.score, fillW:(s.score*10)+'%',
      thumbLeft:'calc('+(s.score*10)+'% - '+(s.score*2.2)+'px)',
      onTrackDown:this.onTrackDown, trackRef:this.trackRef, sendScore:this.sendScore,
      choices:(st.options||[]).map(o=>({label:o,pick:()=>this.pickChoice(o)})),
      pickCustom:this.pickCustom
    };
  }
}
</script>
</body>
</html>
