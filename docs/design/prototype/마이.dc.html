<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
body{margin:0;background:#E6E1D6;font-family:'Pretendard',-apple-system,sans-serif}
a{color:#8C9A76;text-decoration:none}a:hover{color:#6E7B5C}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div style="position:relative;width:390px;height:803px;border-radius:46px;background:#161512;padding:5px;box-sizing:border-box;box-shadow:0 30px 70px rgba(60,56,48,.3)">
<div style="position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:linear-gradient(#D6E8F0,#E4EEF4 24%,#F2ECE0 40%,#F7F4ED 54%);display:flex;flex-direction:column">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 2px;font-size:12px;color:#9AA8AD">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center">
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block;opacity:.4"></span>
    </span>
  </div>

  <div style="flex:none;display:flex;gap:14px;align-items:center;padding:12px 20px 14px">
    <span style="width:74px;height:74px;border-radius:50%;border:1.5px solid #C7D3C0;background:#F7F4ED;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none">
      <img src="assets/capybara2-trim.png" alt="내 캐릭터" style="width:56px;display:block"></img>
    </span>
    <span style="display:flex;flex-direction:column;gap:6px">
      <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:21px;color:#3C3830">{{ nickname }}</span>
      <span style="font-size:13px;color:#8F9A83">총 회고 {{ count }}회</span>
    </span>
  </div>

  <div style="flex:none;height:28px;position:relative;overflow:hidden">
    <div style="position:absolute;left:-20%;top:2px;width:140%;height:56px;background:#C7D3C0;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
  </div>

  <div style="flex:1;min-height:0;background:#C7D3C0;padding:0 16px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto">

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="flex:none;display:flex;flex-direction:column;gap:6px">
        <span style="font-size:12px;color:#5C6552">{{ g.label }}</span>
        <div style="border-radius:16px;overflow:hidden;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(60,56,48,.05)">
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
            <button onClick="{{ r.tap }}" style="width:100%;border:none;background:none;display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:{{ r.divider }};font-family:'Pretendard',sans-serif;font-size:14px;color:#3C3830;cursor:pointer" style-hover="background:rgba(247,244,237,.7)">
              <span>{{ r.title }}</span>
              <span style="display:flex;align-items:center;gap:8px">
                <span style="font-size:12px;color:#8F9A83">{{ r.value }}</span>
                <span style="color:#B9B2A2">›</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="flex:none;margin-top:auto;text-align:center;padding-bottom:6px">
      <button onClick="{{ askLeave }}" style="border:none;background:none;font-family:'Pretendard',sans-serif;font-size:13px;color:#8F9A83;border-bottom:1px solid #8F9A83;cursor:pointer;padding:2px 2px">회원 탈퇴</button>
    </div>

  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSheet }}" style="position:absolute;inset:0;z-index:10;background:rgba(60,56,48,.34);animation:fadeIn .2s ease"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:76%;background:#FDFBF5;border-radius:22px 22px 0 0;padding:14px 20px 24px;display:flex;flex-direction:column;gap:12px;animation:riseIn .28s cubic-bezier(.25,.95,.3,1)">
      <div style="flex:none;width:38px;height:4px;border-radius:2px;background:#E2DCCC;margin:0 auto 2px"></div>
      <div style="flex:none;display:flex;align-items:center;gap:8px">
        <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:20px;color:#3C3830">{{ sheetTitle }}</span>
        <button onClick="{{ closeSheet }}" style="margin-left:auto;border:none;background:none;font-size:14px;color:#B9B2A2;cursor:pointer;padding:2px 4px">✕</button>
      </div>

      <sc-if value="{{ isOnboarding }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:14px">
          <div style="flex:1;min-height:0;border-radius:16px;background:#F1EDE3;padding:22px 18px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center">
            <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:22px;color:#3C3830">{{ obTitle }}</span>
            <span style="font-size:13px;line-height:1.75;color:#6E7B5C;word-break:keep-all">{{ obBody }}</span>
          </div>
          <div style="flex:none;display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;color:#B9B2A2">{{ obStep }}</span>
            <button onClick="{{ obNext }}" style="margin-left:auto;border:none;border-radius:14px;background:#8FA28A;color:#fff;padding:12px 22px;font-family:'Pretendard',sans-serif;font-size:14px;cursor:pointer">{{ obCta }}</button>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:10px">
          <span style="font-size:13px;line-height:1.6;color:#8F9A83;word-break:keep-all">문의 내용을 남기시면 운영팀이 이혀하로 답변해드리게요.</span>
          <textarea value="{{ contactText }}" onChange="{{ onContact }}" placeholder="어떤 이야기인가요?" style="flex:1;min-height:120px;border:1px solid #E7E1D2;border-radius:14px;background:#fff;padding:12px 14px;font-family:'Pretendard',sans-serif;font-size:13px;line-height:1.6;color:#3C3830;outline:none;resize:none"></textarea>
          <button onClick="{{ sendContact }}" style="flex:none;border:none;border-radius:14px;background:{{ contactBg }};color:#fff;padding:14px;font-family:'Pretendard',sans-serif;font-size:14px;cursor:pointer">보내기</button>
        </div>
      </sc-if>

      <sc-if value="{{ isPolicy }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px">
          <sc-for list="{{ policy }}" as="p" hint-placeholder-count="3">
            <div style="flex:none;display:flex;flex-direction:column;gap:5px">
              <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:16px;color:#3C3830">{{ p.title }}</span>
              <span style="font-size:13px;line-height:1.75;color:#6E6B60;word-break:keep-all">{{ p.body }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{ isNotify }}" hint-placeholder-val="{{ false }}">
        <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:12px">
          <div style="flex:none;display:flex;align-items:center;gap:10px;border-radius:14px;background:#F1EDE3;padding:14px 16px">
            <span style="flex:1;font-size:14px;color:#3C3830">매일 회고 알림</span>
            <button onClick="{{ toggleNotify }}" style="flex:none;width:46px;height:26px;border-radius:999px;border:none;background:{{ switchBg }};position:relative;cursor:pointer;padding:0;transition:background .2s ease">
              <span style="position:absolute;top:3px;left:{{ switchX }};width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s ease;display:block"></span>
            </button>
          </div>
          <span style="flex:none;font-size:12px;color:#8F9A83">알림 시각</span>
          <div style="flex:none;display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ times }}" as="t" hint-placeholder-count="4">
              <button onClick="{{ t.pick }}" style="border:none;border-radius:14px;background:{{ t.bg }};color:{{ t.color }};padding:10px 16px;font-family:'Pretendard',sans-serif;font-size:13px;cursor:pointer">{{ t.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

    </div>
  </sc-if>

  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:28px;right:28px;bottom:96px;z-index:6;background:rgba(60,56,48,.92);color:#F7F4ED;border-radius:14px;padding:13px 16px;font-size:13px;line-height:1.55;text-align:center;animation:cardIn .24s cubic-bezier(.3,.9,.3,1)">{{ toastText }}</div>
  </sc-if>

  <sc-if value="{{ leaving }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ cancelLeave }}" style="position:absolute;inset:0;z-index:8;background:rgba(60,56,48,.34);animation:fadeIn .2s ease"></div>
    <div style="position:absolute;left:28px;right:28px;top:50%;z-index:9;transform:translateY(-50%);background:#FDFBF5;border-radius:20px;padding:24px 22px 18px;animation:cardIn .26s cubic-bezier(.3,.9,.3,1);box-shadow:0 12px 32px rgba(60,56,48,.2)">
      <div style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:20px;color:#3C3830;text-align:center;margin-bottom:8px">{{ leaveTitle }}</div>
      <div style="font-size:13px;line-height:1.7;color:#8F9A83;text-align:center;margin-bottom:20px;word-break:keep-all">{{ leaveDesc }}</div>
      <div style="display:flex;gap:10px">
        <button onClick="{{ cancelLeave }}" style="flex:1;border:1.5px solid #C3C1B6;background:#fff;border-radius:14px;padding:13px;font-family:'Pretendard',sans-serif;font-size:14px;color:#5F6B4D;cursor:pointer">그대로 둘게요</button>
        <button onClick="{{ confirmLeave }}" style="flex:1;border:none;background:#C2796A;border-radius:14px;padding:13px;font-family:'Pretendard',sans-serif;font-size:14px;color:#FDFBF5;cursor:pointer">{{ leaveCta }}</button>
      </div>
    </div>
  </sc-if>

  <div style="flex:none;display:flex;justify-content:space-around;align-items:center;padding:9px 8px 14px;background:#FDFBF5;border-top:1px solid #EFEADE">
    <a href="홈.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">홈</span>
    </a>
    <a href="쉼터.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">쉼터</span>
    </a>
    <a href="보관함.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">보관함</span>
    </a>
    <a href="리포트.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">리포트</span>
    </a>
    <a href="마이.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #8C9A76;border-radius:7px;background:rgba(143,162,138,.14);display:block"></span>
      <span style="font-size:11px;color:#5F6B4D">마이</span>
    </a>
  </div>

</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:924},&quot;nickname&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;지현&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reflectionCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:365,&quot;tsType&quot;:&quot;number&quot;}}">
const OB=[
  ['하루를 짧게 돌아보기','오늘 한 질문에만 답하면 회고가 마무리되어요. 길지 않아도 충분해요.'],
  ['캐릭터가 다시 쓰기','내가 쓴 하루를 캐릭터가 다른 시선으로 다시 적어줘요.'],
  ['작은 행동 한 장','기록을 보고 오늘 해볼 만한 행동을 한 장 제안해드릴게요.']
];
const POLICY=[
  ['수집하는 정보','닉네임, 회고·일기 내용, 감정 기록, 알림 시간을 수집해요. 연락처나 연속 생일은 수집하지 않아요.'],
  ['보관과 삭제','기록은 기기에 잠긴 후 서버에 보관되며, 탈톴 시 30일 뒤 모든 기록이 파기되어요.'],
  ['제3자 제공','기록은 학습이나 마케팅 용도로 사용하거나 판매하지 않아요.'],
  ['이용자 권리','언제든 기록 사본을 내려받거나 삭제를 요슭할 수 있어요. 문의하기로 알려주세요.']
];

class Component extends DCLogic {
  state={notify:true,time:'21:00',toast:'',leave:0,sheet:null,ob:0,contact:''};

  toast=(t)=>{
    this.setState({toast:t});
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.setState({toast:''}),1800);
  };
  toggleNotify=()=>this.setState(s=>{
    const v=!s.notify;
    this.toast(v?'매일 '+s.time+'에 알려드릴게요.':'알림을 꺼뒀어요.');
    return {notify:v};
  });
  openSheet=(k)=>this.setState({sheet:k,ob:0});
  closeSheet=()=>this.setState({sheet:null});
  obNext=()=>this.setState(s=>{
    if(s.ob>=2){this.toast('온보딩을 다시 봤어요.');return {sheet:null,ob:0};}
    return {ob:s.ob+1};
  });
  onContact=(e)=>this.setState({contact:e.target.value});
  sendContact=()=>{
    if(!this.state.contact.trim())return this.toast('내용을 적어주세요.');
    this.setState({sheet:null,contact:''});
    this.toast('문의를 보냈어요. 1~2일 안에 답변드릴게요.');
  };
  pickTime=(t)=>{this.setState({time:t,notify:true});this.toast('매일 '+t+'에 알려드릴게요.');};
  logout=()=>{this.toast('로그아웃했어요. 홈으로 돌아갈게요.');setTimeout(()=>{window.location.href='홈.dc.html';},1100);};
  askLeave=()=>this.setState({leave:1});
  cancelLeave=()=>this.setState({leave:0});
  confirmLeave=()=>this.setState(s=>{
    if(s.leave===1)return {leave:2};
    this.toast('탈퇴를 접수했어요. 기록은 30일 후 삭제돼요.');
    setTimeout(()=>{window.location.href='홈.dc.html';},1400);
    return {leave:0};
  });
  componentWillUnmount(){clearTimeout(this._t);}

  renderVals(){
    const s=this.state;
    const row=(title,value,tap,last)=>({title,value:value||'',tap:tap||(()=>{}),divider:last?'none':'1px solid #E7E1D2'});
    return {
      nickname:this.props.nickname??'지현',
      count:this.props.reflectionCount??12,
      groups:[
        {label:'앱 설정',rows:[
          row('알림 설정',s.notify?'매일 '+s.time:'꺼짐',()=>this.openSheet('notify')),
          row('온보딩 다시하기','',()=>this.openSheet('ob'),true)
        ]},
        {label:'지원',rows:[
          row('문의하기','',()=>this.openSheet('contact')),
          row('정책 · 약관','',()=>this.openSheet('policy'),true)
        ]},
        {label:'계정',rows:[
          row('로그아웃','',this.logout,true)
        ]}
      ],
      sheetOpen:!!s.sheet, closeSheet:this.closeSheet,
      sheetTitle:s.sheet==='notify'?'알림 설정':s.sheet==='ob'?'온보딩':s.sheet==='contact'?'문의하기':'정책 · 약관',
      isNotify:s.sheet==='notify', isOnboarding:s.sheet==='ob', isContact:s.sheet==='contact', isPolicy:s.sheet==='policy',
      switchBg:s.notify?'#8FA28A':'#D8D2C2', switchX:s.notify?'23px':'3px',
      toggleNotify:this.toggleNotify,
      times:['20:00','21:00','22:00','23:00'].map(t=>({label:t,
        bg:s.time===t?'#8FA28A':'#F1EDE3', color:s.time===t?'#fff':'#5F6B4D',
        pick:()=>this.pickTime(t)})),
      obTitle:OB[s.ob][0], obBody:OB[s.ob][1], obStep:(s.ob+1)+' / 3',
      obCta:s.ob>=2?'다 봤어요':'다음', obNext:this.obNext,
      contactText:s.contact, onContact:this.onContact, sendContact:this.sendContact,
      contactBg:s.contact.trim()?'#8FA28A':'#C3C1B6',
      policy:POLICY.map(p=>({title:p[0],body:p[1]})),
      askLeave:this.askLeave, cancelLeave:this.cancelLeave, confirmLeave:this.confirmLeave,
      leaving:s.leave>0,
      leaveTitle:s.leave===2?'정말 탈퇴할까요?':'회원 탈퇴를 진행할까요?',
      leaveDesc:s.leave===2?'12번의 회고와 일기가 모두 사라져요. 이 작업은 되돌릴 수 없어요.':'지금까지 쌓인 기록은 복구할 수 없어요. 잠시 쉬어가고 싶다면 알림만 꺼둘 수도 있어요.',
      leaveCta:s.leave===2?'탈퇴할게요':'계속',
      toast:!!s.toast, toastText:s.toast
    };
  }
}
</script>
</body>
</html>
