<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
body{margin:0;background:#E6E1D6;font-family:'Pretendard',-apple-system,sans-serif}
a{color:#8C9A76;text-decoration:none}a:hover{color:#6E7B5C}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div style="position:relative;width:390px;height:803px;border-radius:46px;background:#161512;padding:5px;box-sizing:border-box;box-shadow:0 30px 70px rgba(60,56,48,.3)">
<div style="position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:linear-gradient(#D6E8F0,#E4EEF4 24%,#F2ECE0 40%,#F7F4ED 54%);display:flex;flex-direction:column">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 2px;font-size:12px;color:#9AA8AD">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center">
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#9AA8AD;display:inline-block;opacity:.4"></span>
    </span>
  </div>

  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 18px 8px">
    <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:23px;color:#3C3830">보관함</span>
    <div style="display:flex;border:1.5px solid #8C9A76;border-radius:16px;overflow:hidden;font-size:12px">
      <button onClick="{{ pickCal }}" style="border:none;padding:6px 14px;background:{{ calBg }};color:{{ calColor }};font-family:'Pretendard',sans-serif;font-size:12px;cursor:pointer">캘린더</button>
      <button onClick="{{ pickList }}" style="border:none;padding:6px 14px;background:{{ listBg }};color:{{ listColor }};font-family:'Pretendard',sans-serif;font-size:12px;cursor:pointer">리스트</button>
    </div>
  </div>

  <sc-if value="{{ isCal }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;animation:fadeIn .26s ease">

      <div style="flex:none;margin:0 16px;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:7px;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(60,56,48,.06)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <button onClick="{{ prevMonth }}" style="border:none;background:none;color:#8F9A83;font-size:17px;cursor:pointer;padding:0 6px">‹</button>
          <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:17px;color:#3C3830">{{ monthLabel }}</span>
          <button onClick="{{ nextMonth }}" style="border:none;background:none;color:#8F9A83;font-size:17px;cursor:pointer;padding:0 6px">›</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px">
          <span style="color:#C2796A">일</span><span style="color:#8A8474">월</span><span style="color:#8A8474">화</span><span style="color:#8A8474">수</span><span style="color:#8A8474">목</span><span style="color:#8A8474">금</span><span style="color:#7A96B0">토</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
            <button onClick="{{ d.pick }}" style="border:{{ d.border }};height:54px;border-radius:12px;background:{{ d.bg }};color:{{ d.color }};font-family:'Pretendard',sans-serif;font-size:12px;cursor:{{ d.cursor }};padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">
              <span>{{ d.label }}</span>
              {{ d.iconEl }}
            </button>
          </sc-for>
        </div>
      </div>

      <div style="flex:none;height:28px;position:relative;overflow:hidden;margin-top:12px">
        <div style="position:absolute;left:-20%;top:2px;width:140%;height:56px;background:#C7D3C0;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
      </div>

      <div style="flex:1;min-height:0;background:#C7D3C0;padding:0 16px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto">
        <span style="flex:none;font-family:'Pretendard',sans-serif;font-weight:700;font-size:18px;color:#3C3830">{{ recordTitle }}</span>
        <sc-if value="{{ hasRecord }}" hint-placeholder-val="{{ true }}">
          <div style="flex:none;border-radius:16px;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(60,56,48,.05);padding:6px 15px 12px;display:flex;flex-direction:column">
            <sc-if value="{{ hasDiary }}" hint-placeholder-val="{{ true }}">
            <a href="{{ diaryHref }}" style="display:flex;gap:12px;align-items:center;padding:12px 0">
              <span style="width:42px;height:42px;border-radius:50%;background:#F1EDE3;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden">
                {{ recordIconEl }}
              </span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
                <span style="font-size:15px;color:#3C3830">{{ diaryTitle }}</span>
                <span style="font-size:11px;color:#B0AB9C">맑음 · 일기</span>
              </span>
              <span style="border-radius:10px;padding:3px 9px;font-size:11px;background:{{ moodBg }};color:#3C3830;flex:none">{{ mood }}</span>
              <span style="flex:none;font-size:13px;color:#C4BEB2">›</span>
            </a>
            </sc-if>
            <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="2">
              <div style="display:flex;align-items:center;gap:14px;padding:10px 0 10px 11px">
                <span style="flex:none;width:20px;height:20px;border-radius:50%;background:{{ t.bg }}"></span>
                <span style="flex:1;min-width:0;font-size:15px;color:{{ t.color }};overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{ t.title }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noRecord }}" hint-placeholder-val="{{ false }}">
          <div style="flex:none;border-radius:16px;padding:22px 16px;background:rgba(255,255,255,.6);text-align:center;font-size:13px;line-height:1.7;color:#8F9A83">이 날은 기록이 없어요.<br>비어 있어도 괜찮은 날이에요.</div>
        </sc-if>
      </div>

    </div>
  </sc-if>

  <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;animation:fadeIn .26s ease">

      <div style="flex:none;padding:0 16px;display:flex;flex-direction:column;gap:11px;position:relative;z-index:13">
        <div style="border-radius:22px;padding:11px 14px;display:flex;gap:9px;align-items:center;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(60,56,48,.05)">
          <span style="color:#B9B2A2;font-size:14px">⌕</span>
          <input value="{{ query }}" onChange="{{ onQuery }}" onFocus="{{ openKb }}" onClick="{{ openKb }}" ref="{{ inputRef }}" placeholder="일기 내용 검색" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Pretendard',sans-serif;font-size:13px;color:#3C3830"></input>          <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ clearQuery }}" style="border:none;background:none;color:#B9B2A2;font-size:13px;cursor:pointer;padding:0 2px">✕</button>
          </sc-if>
        </div>
        <div style="display:flex;gap:7px;overflow-x:auto;padding-bottom:2px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
            <button onClick="{{ c.pick }}" style="flex:none;border:{{ c.border }};opacity:{{ c.opacity }};transform:scale({{ c.scale }});transition:opacity .18s ease,transform .18s ease;border-radius:16px;padding:6px 13px;font-family:'Pretendard',sans-serif;font-size:13px;background:{{ c.bg }};color:{{ c.color }};cursor:pointer">{{ c.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <button onClick="{{ toggleMonths }}" style="border:none;background:none;padding:0;font-family:'Pretendard',sans-serif;font-size:13px;color:#3C3830;cursor:pointer">{{ monthPickLabel }}</button>
        </div>
        <sc-if value="{{ monthsOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:16px;top:100%;margin-top:4px;z-index:14;border-radius:14px;background:#FDFBF5;box-shadow:0 8px 20px rgba(60,56,48,.16);padding:6px 4px;max-height:260px;overflow-y:auto;display:inline-flex;flex-direction:column;align-items:stretch;animation:fadeIn .16s ease">
            <sc-for list="{{ monthOptions }}" as="m" hint-placeholder-count="3">
              <button onClick="{{ m.pick }}" style="border:none;background:none;padding:11px 12px;text-align:left;cursor:pointer;font-family:'Pretendard',sans-serif;font-size:14px;font-weight:{{ m.weight }};color:{{ m.color }}" style-hover="background:#F3EFE5">{{ m.label }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <div style="flex:none;height:26px;position:relative;overflow:hidden;margin-top:10px">
        <div style="position:absolute;left:-20%;top:2px;width:140%;height:54px;background:#C7D3C0;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
      </div>

      <div style="flex:1;min-height:0;background:#C7D3C0;padding:0 16px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto">
        <sc-for list="{{ entries }}" as="e" hint-placeholder-count="5">
          <a href="{{ e.href }}" style="flex:none;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(60,56,48,.05)">
            <span style="width:44px;height:44px;border-radius:50%;background:#F1EDE3;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden">
              {{ e.iconEl }}
            </span>
            <span style="flex:1;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:14px;color:#3C3830">{{ e.title }}</span>
              <span style="font-size:11px;color:#8F9A83">{{ e.snippet }}</span>
            </span>
            <span style="border-radius:10px;padding:3px 9px;font-size:11px;background:{{ e.moodBg }};color:#3C3830;flex:none">{{ e.mood }}</span>
          </a>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
          <div style="flex:none;border-radius:16px;padding:22px 16px;background:rgba(255,255,255,.6);text-align:center;font-size:13px;line-height:1.7;color:#8F9A83">조건에 맞는 일기가 없어요.</div>
        </sc-if>
      </div>

    </div>
  </sc-if>

  <div onClick="{{ dismissAll }}" style="position:absolute;inset:0;z-index:11;background:transparent;pointer-events:{{ dismissPointer }}"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;z-index:12;height:288px;background:#D4CCC0;padding:8px 3px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:9px;transform:translateY({{ kbY }});pointer-events:{{ kbPointer }};transition:transform .3s cubic-bezier(.3,.9,.3,1)">
      <sc-for list="{{ keyRows }}" as="row" hint-placeholder-count="4">
        <div style="display:flex;gap:5px;padding:0 3px;flex:1">
          <sc-for list="{{ row.keys }}" as="k" hint-placeholder-count="10">
            <button onClick="{{ k.press }}" style="flex:{{ k.f }};min-width:0;border:none;border-radius:6px;background:{{ k.bg }};color:{{ k.color }};font-family:'Pretendard',sans-serif;font-size:{{ k.size }};box-shadow:0 1px 0 rgba(0,0,0,.22);cursor:pointer;padding:0" style-active="transform:translateY(1px)">{{ k.label }}</button>
          </sc-for>
        </div>
      </sc-for>
  </div>

  <div style="flex:none;display:flex;justify-content:space-around;align-items:center;padding:9px 8px 14px;background:#FDFBF5;border-top:1px solid #EFEADE;transform:translateY({{ navY }});transition:transform .26s cubic-bezier(.3,.9,.3,1)">
    <a href="홈.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">홈</span>
    </a>
    <a href="쉼터.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">쉼터</span>
    </a>
    <a href="보관함.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #8C9A76;border-radius:7px;background:rgba(143,162,138,.14);display:block"></span>
      <span style="font-size:11px;color:#5F6B4D">보관함</span>
    </a>
    <a href="리포트.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">리포트</span>
    </a>
    <a href="마이.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">마이</span>
    </a>
  </div>

</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:924},&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;캘린더&quot;,&quot;리스트&quot;],&quot;default&quot;:&quot;캘린더&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MOOD_BG={'행복함':'#F3D07A','두근함':'#EFA76B','평온함':'#A8C79B','피곤함':'#B4C3CC','무기력':'#C7C1B6','우울함':'#A9B5D9','불안함':'#BFC7AE','막막함':'#C9AFA6','화남/답답':'#E4886C'};
const MOOD_ICON={'행복함':'assets/mood-happy.png','두근함':'assets/mood-excited.png','평온함':'assets/mood-calm.png','피곤함':'assets/mood-tired.png','무기력':'assets/mood-flat.png','우울함':'assets/mood-down.png','불안함':'assets/mood-anxious.png','막막함':'assets/mood-stuck.png','화남/답답':'assets/mood-angry.png'};
const NEUTRAL='#C4BCAF';
// 샘플 데이터는 ./data.js 에서 생성 (2025-08-01 ~ 2026-08-13)
const MOODS=['행복함','두근함','평온함','피곤함','무기력','우울함','불안함','막막함','화남/답답'];

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_COMBO={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const JONG_COMBO={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const JONG_SPLIT={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
const JUNG_SPLIT={'ㅘ':['ㅗ','ㅏ'],'ㅙ':['ㅗ','ㅐ'],'ㅚ':['ㅗ','ㅣ'],'ㅝ':['ㅜ','ㅓ'],'ㅞ':['ㅜ','ㅔ'],'ㅟ':['ㅜ','ㅣ'],'ㅢ':['ㅡ','ㅣ']};
const isSyl=c=>c>='가'&&c<='힣';
const decomp=c=>{const n=c.charCodeAt(0)-44032;return{c:CHO[Math.floor(n/588)],v:JUNG[Math.floor((n%588)/28)],t:JONG[n%28]};};
const comp=(c,v,t)=>String.fromCharCode(44032+CHO.indexOf(c)*588+JUNG.indexOf(v)*28+JONG.indexOf(t||''));
const K1=['ㅂ','ㅈ','ㄷ','ㄱ','ㅅ','ㅛ','ㅕ','ㅑ','ㅐ','ㅔ'];
const K1S=['ㅃ','ㅉ','ㄸ','ㄲ','ㅆ','ㅛ','ㅕ','ㅑ','ㅒ','ㅖ'];
const K2=['ㅁ','ㄴ','ㅇ','ㄹ','ㅎ','ㅗ','ㅓ','ㅏ','ㅣ'];
const K3=['ㅋ','ㅌ','ㅊ','ㅍ','ㅠ','ㅜ','ㅡ'];

class Component extends DCLogic {
  state={tab:'cal',selected:13,ym:'2026-8',query:'',mood:null,monthsOpen:false,kb:false,shift:false,ready:false,mode:'ko'};
  inputRef=React.createRef();
  componentDidMount(){
    import('./data.js').then(m=>{this.D=m;this.setState({ready:true});});
    if((this.props.startTab??'캘린더')==='리스트')this.setState({tab:'list'});
  }

  pickCal=()=>this.setState({tab:'cal',kb:false,monthsOpen:false});
  pickList=()=>this.setState({tab:'list'});
  shiftMonth=(step)=>this.setState(s=>{
    let [y,m]=s.ym.split('-').map(Number);
    m+=step; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    if(y<2025||(y===2025&&m<8)||y>2026||(y===2026&&m>8))return null;
    return {ym:y+'-'+m,selected:this.firstRecordDay(y,m),monthsOpen:false};
  });
  prevMonth=()=>this.shiftMonth(-1);
  nextMonth=()=>this.shiftMonth(1);
  toggleMonths=()=>this.setState(s=>({monthsOpen:!s.monthsOpen,kb:false}));
  pickMonth=(k)=>{const [y,m]=k.split('-').map(Number);this.setState({ym:k,monthsOpen:false,selected:this.firstRecordDay(y,m)});};
  firstRecordDay(y,m){
    if(!this.D)return 1;
    const len=new Date(y,m,0).getDate();
    for(let d=len;d>=1;d--){const g=this.D.getDay(y,m,d);if(g&&(g.diary||g.tasks.length))return d;}
    return 1;
  }
  onQuery=(e)=>this.setState({query:e.target.value});
  clearQuery=()=>this.setState({query:''});
  openKb=()=>this.setState({kb:true,monthsOpen:false});
  setMode=(m)=>this.setState({mode:m,shift:false});
  closeKb=()=>{const el=this.inputRef.current;if(el)el.blur();this.setState({kb:false,shift:false});};
  dismissAll=()=>{const el=this.inputRef.current;if(el)el.blur();this.setState({kb:false,shift:false,monthsOpen:false});};
  pickMood=(m)=>this.setState(s=>({mood:s.mood===m?null:m}));

  insertJamo=(j)=>{
    const s=this.state.query;const last=s.slice(-1);const head=s.slice(0,-1);
    const isC=CHO.indexOf(j)>=0||JONG.indexOf(j)>0;const isV=JUNG.indexOf(j)>=0;
    let out;
    if(isV){
      if(isSyl(last)){
        const d=decomp(last);
        if(d.t){
          const sp=JONG_SPLIT[d.t];
          if(sp)out=head+comp(d.c,d.v,sp[0])+comp(sp[1],j,'');
          else out=head+comp(d.c,d.v,'')+comp(d.t,j,'');
        }else{
          const cb=JUNG_COMBO[d.v+j];
          out=cb?head+comp(d.c,cb,d.t):s+j;
        }
      }else if(CHO.indexOf(last)>=0)out=head+comp(last,j,'');
      else if(JUNG.indexOf(last)>=0&&JUNG_COMBO[last+j])out=head+JUNG_COMBO[last+j];
      else out=s+j;
    }else if(isC){
      if(isSyl(last)){
        const d=decomp(last);
        if(!d.t&&JONG.indexOf(j)>0)out=head+comp(d.c,d.v,j);
        else if(d.t&&JONG_COMBO[d.t+j])out=head+comp(d.c,d.v,JONG_COMBO[d.t+j]);
        else out=s+j;
      }else out=s+j;
    }else out=s+j;
    this.setState({query:out,shift:false});
  };
  backspace=()=>{
    const s=this.state.query;if(!s)return;const last=s.slice(-1);const head=s.slice(0,-1);
    if(isSyl(last)){
      const d=decomp(last);
      if(d.t){const sp=JONG_SPLIT[d.t];this.setState({query:head+comp(d.c,d.v,sp?sp[0]:'')});}
      else{const sp=JUNG_SPLIT[d.v];this.setState({query:head+(sp?comp(d.c,sp[0],''):d.c)});}
    }else this.setState({query:head});
  };

  renderVals(){
    const s=this.state;
    const [year,month]=s.ym.split('-').map(Number);
    const recs={};
    {
      const len0=new Date(year,month,0).getDate();
      if(this.D)for(let d=1;d<=len0;d++){
        const g=this.D.getDay(year,month,d);
        if(g&&(g.diary||g.tasks.length))recs[d]={mood:g.diary?g.diary.mood:null,excerpt:g.diary?g.diary.excerpt:'',tasks:g.tasks,hasDiary:!!g.diary};
      }
    }
    const ce=React.createElement;
    const iconEl=(mood,w)=>mood?ce('img',{src:MOOD_ICON[mood],alt:'',style:{width:w,display:'block'}}):null;
    const days=[];
    const first=new Date(year,month-1,1).getDay();
    const len=new Date(year,month,0).getDate();
    for(let i=0;i<first;i++)days.push({label:'',bg:'transparent',color:'transparent',border:'none',cursor:'default',pick:()=>{}});
    for(let d=1;d<=len;d++){
      const r=recs[d];
      const sel=d===s.selected;
      days.push({
        label:String(d),
        bg:sel?'#3C3830':(r?'rgba(255,255,255,.92)':'rgba(247,244,237,.55)'),
        color:sel?'#F7F4ED':'#3C3830',
        hasIcon:!!r, iconEl:iconEl(r?r.mood:null,22),
        border:'1.5px solid transparent',
        cursor:'pointer',
        pick:()=>this.setState({selected:d})
      });
    }
    const rec=recs[s.selected];
    const q=s.query.trim();
    const entries=Object.keys(recs).map(Number).sort((a,b)=>b-a)
      .filter(d=>recs[d].hasDiary&&(!s.mood||recs[d].mood===s.mood)&&(!q||recs[d].excerpt.indexOf(q)>=0))
      .map(d=>({title:month+'월 '+d+'일의 일기',snippet:recs[d].excerpt.slice(0,18)+'…',mood:recs[d].mood,moodBg:MOOD_BG[recs[d].mood],iconEl:iconEl(recs[d].mood,34),href:'일기.dc.html?mode=view&y='+year+'&m='+month+'&d='+d}));

    const mk=(label,f,bg,color,size,press)=>({label,f,bg:bg||'#FFFDF8',color:color||'#2C2620',size:size||'16px',press});
    const G='#B7AE9F';
    const put=(ch)=>()=>this.setState(p=>({query:p.query+ch,shift:false}));
    const bottom=(a,b)=>[mk(a[0],1.4,G,'#fff','13px',a[1]),mk(b[0],1.4,G,'#fff','13px',b[1]),
      mk('',4,null,null,null,put(' ')),mk('.',1,null,null,null,put('.')),
      mk('완료',1.6,'#7C9E86','#fff','14px',this.closeKb)];
    let rows;
    if(s.mode==='sym'){
      rows=[
        '1234567890'.split('').map(c=>mk(c,1,null,null,null,put(c))),
        ['-','/',':',';','(',')','₩','&','@','"'].map(c=>mk(c,1,null,null,null,put(c))),
        [mk('#+=',1.4,G,'#fff','13px',()=>this.setMode('sym2'))].concat(['.',',','?','!','\''].map(c=>mk(c,1.2,null,null,null,put(c)))).concat([mk('⌫',1.4,G,'#fff','15px',this.backspace)]),
        bottom(['한글',()=>this.setMode('ko')],['ABC',()=>this.setMode('en')])
      ];
    }else if(s.mode==='sym2'){
      rows=[
        ['[',']','{','}','#','%','^','*','+','='].map(c=>mk(c,1,null,null,null,put(c))),
        ['_','\\','|','~','<','>','$','€','¥','•'].map(c=>mk(c,1,null,null,null,put(c))),
        [mk('123',1.4,G,'#fff','13px',()=>this.setMode('sym'))].concat(['.',',','?','!','\''].map(c=>mk(c,1.2,null,null,null,put(c)))).concat([mk('⌫',1.4,G,'#fff','15px',this.backspace)]),
        bottom(['한글',()=>this.setMode('ko')],['ABC',()=>this.setMode('en')])
      ];
    }else if(s.mode==='en'){
      const up=s.shift;
      const m=c=>{const ch=up?c.toUpperCase():c;return mk(ch,1,null,null,null,put(ch));};
      rows=[
        'qwertyuiop'.split('').map(m),
        'asdfghjkl'.split('').map(m),
        [mk('⇧',1.4,up?'#8E8579':G,'#fff','15px',()=>this.setState(p=>({shift:!p.shift})))]
          .concat('zxcvbnm'.split('').map(m))
          .concat([mk('⌫',1.4,G,'#fff','15px',this.backspace)]),
        bottom(['!#1',()=>this.setMode('sym')],['한/영',()=>this.setMode('ko')])
      ];
    }else{
      rows=[
        (s.shift?K1S:K1).map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))),
        K2.map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))),
        [mk('⇧',1.4,s.shift?'#8E8579':G,'#fff','15px',()=>this.setState(p=>({shift:!p.shift})))]
          .concat(K3.map(j=>mk(j,1,null,null,null,()=>this.insertJamo(j))))
          .concat([mk('⌫',1.4,G,'#fff','15px',this.backspace)]),
        bottom(['!#1',()=>this.setMode('sym')],['한/영',()=>this.setMode('en')])
      ];
    }

    return {
      isCal:s.tab==='cal', isList:s.tab==='list',
      pickCal:this.pickCal, pickList:this.pickList,
      calBg:s.tab==='cal'?'#8FA28A':'transparent', calColor:s.tab==='cal'?'#fff':'#5F6B4D',
      listBg:s.tab==='list'?'#8FA28A':'transparent', listColor:s.tab==='list'?'#fff':'#5F6B4D',
      monthLabel:year+'년 '+month+'월', prevMonth:this.prevMonth, nextMonth:this.nextMonth, days,
      monthPickLabel:year+'년 '+month+'월 ▾', toggleMonths:this.toggleMonths, monthsOpen:s.monthsOpen,
      monthOptions:(this.D?this.D.monthKeys():[]).map(k=>{
        const [y,m]=k.split('-').map(Number);
        const on=k===s.ym;
        return {label:y+'년 '+m+'월',
          bg:on?'#F1EDE3':'transparent',color:on?'#3C3830':'#6E6B60',
          weight:on?700:400,pick:()=>this.pickMonth(k)};
      }),
      recordTitle:month+'월 '+s.selected+'일의 기록',
      hasRecord:!!rec, noRecord:!rec, hasDiary:!!(rec&&rec.hasDiary),
      mood:rec?rec.mood:'', moodBg:rec?MOOD_BG[rec.mood]:'#E7E1D2',
      recordIconEl:iconEl(rec&&rec.hasDiary?rec.mood:null,32),
      diaryTitle:month+'월 '+s.selected+'일의 일기',
      diaryHref:'일기.dc.html?mode=view&y='+year+'&m='+month+'&d='+s.selected,
      tasks:(rec?rec.tasks:[]).map(t=>({
        title:t[0],
        bg:t[1]?(MOOD_BG[t[2]]||NEUTRAL):'#EAE5DA',
        color:t[1]?'#3C3830':'#B9B2A2'
      })),
      query:s.query, onQuery:this.onQuery, hasQuery:!!q, clearQuery:this.clearQuery,
      openKb:this.openKb, closeKb:this.closeKb, kbOpen:s.kb, inputRef:this.inputRef, navY:s.kb?'110%':'0%',
      kbY:s.kb?'0%':'100%', kbPointer:s.kb?'auto':'none',
      dismissAll:this.dismissAll, dismissPointer:s.kb||s.monthsOpen?'auto':'none',       keyRows:rows.map(k=>({keys:k})),
      chips:MOODS.map(l=>({
        label:l, bg:MOOD_BG[l], color:'#3C3830', border:'none',
        opacity:!s.mood||s.mood===l?1:.42,
        scale:s.mood===l?1.04:1,
        pick:()=>this.pickMood(l)
      })),
      countLabel:entries.length+'건', entries, empty:entries.length===0
    };
  }
}
</script>
</body>
