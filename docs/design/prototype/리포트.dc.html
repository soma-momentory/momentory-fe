<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
body{margin:0;background:#E6E1D6;font-family:'Pretendard',-apple-system,sans-serif}
a{color:#8C9A76;text-decoration:none}a:hover{color:#6E7B5C}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
::-webkit-scrollbar{width:0;height:0}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div style="position:relative;width:390px;height:803px;border-radius:46px;background:#161512;padding:5px;box-sizing:border-box;box-shadow:0 30px 70px rgba(60,56,48,.3)">
<div style="position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#F7F4ED;display:flex;flex-direction:column">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 26px 2px;font-size:12px;color:#A8A294">
    <span>9:41</span>
    <span style="display:flex;gap:4px;align-items:center">
      <span style="width:4px;height:9px;border-radius:1px;background:#A8A294;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#A8A294;display:inline-block"></span>
      <span style="width:4px;height:9px;border-radius:1px;background:#A8A294;display:inline-block;opacity:.4"></span>
    </span>
  </div>

  <div style="flex:none;padding:10px 20px 4px;display:flex;justify-content:space-between;align-items:center">
    <button onClick="{{ prevWeek }}" style="border:none;background:none;color:#8F9A83;font-size:18px;cursor:pointer;padding:2px 6px">‹</button>
    <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:20px;color:#3C3830">{{ weekLabel }}</span>
    <button onClick="{{ nextWeek }}" style="border:none;background:none;color:#8F9A83;font-size:18px;cursor:pointer;padding:2px 6px">›</button>
  </div>

  <div style="flex:none;display:flex;justify-content:center;padding:12px 0 8px">
    <div style="width:178px;height:178px;border-radius:50%;background:{{ donut }};display:flex;align-items:center;justify-content:center;transition:background .3s ease">
      <div style="width:100px;height:100px;border-radius:50%;background:#F7F4ED;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <span style="font-family:'Pretendard',sans-serif;font-weight:700;font-size:19px;color:#3C3830">{{ focus.name }}</span>
        <span style="font-size:12px;color:#8F9A83">{{ focus.pct }}</span>
      </div>
    </div>
  </div>

  <div style="flex:none;display:flex;justify-content:center;gap:8px;padding:0 18px 4px;flex-wrap:wrap">
    <sc-for list="{{ legend }}" as="l" hint-placeholder-count="4">
      <button onClick="{{ l.pick }}" style="display:flex;align-items:center;gap:6px;border:{{ l.border }};background:{{ l.chipBg }};border-radius:14px;padding:5px 11px;font-family:'Pretendard',sans-serif;font-size:12px;color:#3C3830;cursor:pointer">
        <span style="width:9px;height:9px;border-radius:50%;background:{{ l.color }};display:inline-block"></span>{{ l.name }}
      </button>
    </sc-for>
  </div>

  <div style="flex:none;height:36px;position:relative;overflow:hidden">
    <div style="position:absolute;left:-20%;top:8px;width:140%;height:64px;background:#C7D3C0;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
  </div>

  <div style="flex:none;background:#C7D3C0;padding:0 18px 12px">
    <div style="display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:14px;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(60,56,48,.06)">
      <span style="width:58px;height:58px;border-radius:14px;background:#F7F4ED;flex:none;overflow:hidden;display:flex;align-items:flex-end;justify-content:center">
        <img src="assets/capybara2-trim.png" alt="카피바라" style="width:52px;display:block"></img>
      </span>
      <span style="flex:1;font-size:14px;line-height:1.6;color:#3C3830;word-break:keep-all">{{ comment }}</span>
    </div>
  </div>

  <div style="flex:none;height:30px;position:relative;overflow:hidden;background:#C7D3C0">
    <div style="position:absolute;left:-16%;top:4px;width:132%;height:56px;background:#8FA28A;border-radius:50% 50% 0 0 / 100% 100% 0 0"></div>
  </div>

  <div style="flex:1;min-height:0;background:#8FA28A;padding:8px 20px 0;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:{{ s.divider }};padding-bottom:9px;font-size:14px">
        <span style="color:rgba(255,255,255,.72)">{{ s.label }}</span>
        <span style="color:#fff">{{ s.value }}</span>
      </div>
    </sc-for>
    <a href="보관함.dc.html" style="margin-top:auto;margin-bottom:12px;align-self:flex-start;font-size:12px;color:rgba(255,255,255,.78);border-bottom:1px solid rgba(255,255,255,.4)">이 주의 기록 보러가기</a>
  </div>

  <div style="flex:none;display:flex;justify-content:space-around;align-items:center;padding:9px 8px 14px;background:#FDFBF5;border-top:1px solid #EFEADE">
    <a href="홈.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">홈</span>
    </a>
    <a href="쉼터.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">쉼터</span>
    </a>
    <a href="보관함.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">보관함</span>
    </a>
    <a href="리포트.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #8C9A76;border-radius:7px;background:rgba(143,162,138,.14);display:block"></span>
      <span style="font-size:11px;color:#5F6B4D">리포트</span>
    </a>
    <a href="마이.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <span style="width:22px;height:22px;border:1.5px solid #C3C1B6;border-radius:7px;display:block"></span>
      <span style="font-size:11px;color:#95928A">마이</span>
    </a>
  </div>

</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:470,&quot;height&quot;:924}}">
const MOOD_BG={'행복함':'#F3D07A','두근함':'#EFA76B','평온함':'#A8C79B','피곤함':'#B4C3CC','무기력':'#C7C1B6','우울함':'#A9B5D9','불안함':'#BFC7AE','막막함':'#C9AFA6','화남/답답':'#E4886C'};
const DAY=86400000;
const START=Date.UTC(2025,7,1), TODAY=Date.UTC(2026,7,13);
// 이번 주 일요일 시작
const THIS_WEEK=TODAY-new Date(TODAY).getUTCDay()*DAY;
const MAX_BACK=Math.floor((THIS_WEEK-(START-new Date(START).getUTCDay()*DAY))/(7*DAY));

class Component extends DCLogic {
  state={week:0,focus:0,ready:false};
  componentDidMount(){import('./data.js').then(m=>{this.D=m;this.setState({ready:true});});}

  prevWeek=()=>this.setState(s=>({week:Math.min(MAX_BACK,s.week+1),focus:0}));
  nextWeek=()=>this.setState(s=>({week:Math.max(0,s.week-1),focus:0}));

  weekData(){
    const start=THIS_WEEK-this.state.week*7*DAY;
    const counts={},order=[];
    let tasks=0,tasksDone=0,cards=0,cardsDone=0,diaryDays=0;
    for(let i=0;i<7;i++){
      const t=start+i*DAY;
      if(t<START||t>TODAY)continue;
      const dt=new Date(t);
      const g=this.D?this.D.getDay(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()):null;
      if(!g)continue;
      tasks+=g.tasks.length;
      g.tasks.forEach(tk=>{
        if(tk[1])tasksDone++;
        if(tk[2]){if(!counts[tk[2]]){counts[tk[2]]=0;order.push(tk[2]);}counts[tk[2]]++;}
      });
      if(g.card){cards++;if(g.card.done)cardsDone++;}
      if(g.diary){
        diaryDays++;
        const m=g.diary.mood;
        if(!counts[m]){counts[m]=0;order.push(m);}
        counts[m]++;
      }
      if(g.card){}
    }
    const total=order.reduce((a,k)=>a+counts[k],0);
    let moods=order.sort((a,b)=>counts[b]-counts[a]).slice(0,5)
      .map(k=>[k,MOOD_BG[k],Math.round(counts[k]/total*100)]);
    if(!moods.length)moods=[['기록 없음','#DCD6C8',100]];
    const fmt=(t)=>{const d=new Date(t);return (d.getUTCFullYear()!==2026?d.getUTCFullYear()+'년 ':'')+(d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일';};
    const end=Math.min(start+6*DAY,TODAY);
    const top=moods[0][0];
    const comment=total===0
      ? '이 주에는 남긴 기록이 없어요. 비어 있는 주도 하나의 기록이에요.'
      : (moods.length===1
        ? '이 주는 '+top+'으로 채워진 한 주였어요.'
        : (moods[0][2]>=45
          ? '이 주는 '+top+'이 가장 많았어요. 절반 가까이 그 마음으로 지냈네요.'
          : '이 주는 감정이 고르게 지나갔어요. 하루하루 달랐다는 뜻이기도 해요.'));
    return {
      label:fmt(start)+' ~ '+fmt(end), moods, comment,
      stats:[
        ['이번 주 일정',tasks?tasks+'개 중 '+tasksDone+'개 완료':'기록 없음'],
        ['행동카드',cards?cards+'개 중 '+cardsDone+'개 실행':'기록 없음'],
        ['일기',diaryDays?diaryDays+'일 기록':'기록 없음']
      ]
    };
  }

  renderVals(){
    const s=this.state;
    const w=this.weekData();
    let acc=0;
    const stops=w.moods.map(m=>{const from=acc;acc+=m[2];return m[1]+' '+from+'% '+acc+'%';});
    if(acc<100&&w.moods.length)stops.push(w.moods[w.moods.length-1][1]+' '+acc+'% 100%');
    const fi=Math.min(s.focus,w.moods.length-1);
    const f=w.moods[fi];
    return {
      weekLabel:w.label, prevWeek:this.prevWeek, nextWeek:this.nextWeek,
      donut:'conic-gradient('+stops.join(',')+')',
      focus:{name:f[0],pct:f[2]+'%'},
      legend:w.moods.map((m,i)=>({
        name:m[0],color:m[1],
        chipBg:i===fi?'rgba(255,255,255,.9)':'transparent',
        border:i===fi?'1.5px solid #8C9A76':'1.5px solid transparent',
        pick:()=>this.setState({focus:i})
      })),
      comment:w.comment,
      stats:w.stats.map((st,i)=>({label:st[0],value:st[1],divider:i<w.stats.length-1?'1px solid rgba(255,255,255,.3)':'none'}))
    };
  }
}
</script>
</body>
</html>
