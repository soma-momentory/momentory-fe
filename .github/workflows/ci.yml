name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-studio-visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: design-studio-playwright-results
          path: test-results/

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc 의 legacy-peer-deps 를 그대로 쓴다 — 로컬과 같은 트리가 나와야 한다.
      - run: npm ci

      # 생성물이 손으로 수정됐는지 본다.
      # 상류 저장소 없이 도는 검사다 — 커밋된 파일의 자기 일관성만 확인한다.

      - run: npm run typecheck
      - run: npm run typecheck:expo-lab
      - run: npm run lint
      # eslint-config-prettier 는 충돌 규칙을 끌 뿐 포맷을 검사하지 않는다 — 검사는 이 단계다.
      - run: npm run format:check
      - run: npm run test -- --ci

      # 시크릿이 이력에 들어갔는지 — .gitignore 를 우회해 강제 추가한 경우를 잡는다.
      - name: 시크릿 추적 여부
        run: |
          # .env.example 은 값이 빈 템플릿이라 일부러 커밋한다 — 여기서만 제외한다.
          hits=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|google-services\.json|GoogleService-Info\.plist|\.(jks|p8|p12|key|pem|keystore|mobileprovision)$' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$hits" ]; then
            echo "시크릿으로 보이는 파일이 추적되고 있다:"
            echo "$hits"
            exit 1
          fi
          echo "OK — 추적된 시크릿 없음"
