<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ floating }}" hint-placeholder-val="{{ false }}">
  <div style="height:96px;padding:0 16px 25px;box-sizing:border-box;display:flex;align-items:flex-end">
    <div style="flex:1;height:66px;border-radius:1000px;background:rgba(251,248,241,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(72,41,26,.14), inset 0 0 0 1px rgba(72,41,26,.06);display:grid;grid-template-columns:repeat(5, minmax(0,1fr));padding:0 6px;align-items:center">
      <sc-for list="{{ items }}" as="t" hint-placeholder-count="5">
        <div style="position:relative;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer">
          <div style="position:absolute;inset:0 2px;border-radius:1000px;background:#B9CBA8;opacity:{{ t.hl }}"></div>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#48291A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><path d="{{ t.d }}"></path></svg>
          <span style="position:relative;font-family:Gaegu, cursive;font-weight:700;font-size:14px;line-height:1;color:#48291A">{{ t.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</sc-if>
<sc-if value="{{ torn }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;height:88px;background:#FBF8F1;clip-path:polygon(0 8px, 4% 3px, 9% 7px, 15% 2px, 22% 6px, 30% 1px, 37% 6px, 45% 2px, 53% 7px, 60% 2px, 68% 6px, 75% 1px, 83% 6px, 90% 2px, 96% 7px, 100% 3px, 100% 100%, 0 100%);display:grid;grid-template-columns:repeat(5, minmax(0,1fr));padding:12px 8px 0">
    <sc-for list="{{ items }}" as="t" hint-placeholder-count="5">
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer">
        <div style="position:absolute;top:-2px;width:62px;height:36px;background:#B9CBA8;opacity:{{ t.hl }};border-radius:16px 22px 14px 20px / 18px 14px 20px 16px;transform:rotate(-4deg)"></div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#48291A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><path d="{{ t.d }}"></path></svg>
        <span style="position:relative;font-family:Gaegu, cursive;font-weight:700;font-size:15px;color:#48291A">{{ t.label }}</span>
      </div>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:96},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;floating&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sel = this.props.selected ?? 0;
    const floating = !!this.props.floating;
    const icons = [
      ['홈', 'M3.5 11 12 4l8.5 7M6 9.5V20h12V9.5M10 20v-5h4v5'],
      ['쉼터', 'M12 20s-7.5-4.6-7.5-10A4 4 0 0 1 12 7.6 4 4 0 0 1 19.5 10C19.5 15.4 12 20 12 20Z'],
      ['보관함', 'M4 5h16v14H4zM4 15l4.5-4 4 3.5 3-2.5L20 15'],
      ['리포트', 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6'],
      ['마이', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 21a7.5 7.5 0 0 1 15 0']
    ];
    return { floating, torn: !floating, items: icons.map(([label, d], i) => ({ label, d, hl: i === sel ? 1 : 0 })) };
  }
}
</script>
</body>
</html>
