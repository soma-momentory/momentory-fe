<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/tokens/fonts.css">
<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/tokens/colors.css">
<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<script src="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/_ds_bundle.js"></script>
<style>body{margin:0;background:#E6DDCC;font-family:var(--font-text, -apple-system, system-ui, sans-serif);} a{color:#48291A;} a:hover{color:#5B7553;}</style>
</helmet>
<div data-screen-label="2a 보관함 통일" style="width:402px;height:874px;border-radius:44px;overflow:hidden;position:relative;background-color:#F6F1E7;background-image:linear-gradient(#EAE2D3 1px, transparent 1px),linear-gradient(90deg,#EAE2D3 1px, transparent 1px);background-size:22px 22px;box-shadow:0 0 0 10px #1F1A15, 0 30px 60px rgba(0,0,0,.18)">
      <x-import component-from-global-scope="IOS26UIKitDesignSystem_138099.StatusBar" hint-size="100%,62px" style="position:relative;z-index:2"></x-import>
      <div style="position:relative;padding:4px 20px 0 22px;display:flex;justify-content:space-between;align-items:flex-start">
        <div style="position:relative">
          <div style="background:#E9D6BF;padding:6px 22px 10px 18px;transform:rotate(-3deg);clip-path:polygon(2% 10%, 8% 0, 30% 6%, 55% 0, 80% 5%, 98% 0, 100% 45%, 97% 100%, 70% 94%, 40% 100%, 12% 95%, 0 100%, 3% 50%)"><span style="font-family:Gaegu, cursive;font-weight:700;font-size:36px;color:#48291A">보관함</span></div>
          <div style="position:absolute;left:16px;bottom:-22px;background:#CDAE8A;padding:2px 14px;transform:rotate(-1deg);white-space:nowrap"><span style="font-family:Gaegu, cursive;font-weight:700;font-size:18px;color:#48291A">2026년 10월</span></div>
        </div>
        <div style="display:flex;gap:2px"><span style="width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#48291A">‹</span><span style="width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B3A898">›</span></div>
      </div>
      <div style="position:relative;margin:34px 16px 0;background:#FBF8F1;border-radius:16px;padding:14px 10px 8px;box-shadow:0 6px 18px rgba(72,41,26,.08)">
        <div style="position:absolute;left:140px;top:-12px;width:92px;height:24px;transform:rotate(-2deg);background:conic-gradient(rgba(201,160,120,.55) 25%, rgba(255,250,240,.6) 0 50%, rgba(201,160,120,.55) 0 75%, rgba(255,250,240,.6) 0) 0 0/10px 10px"></div>
        <div style="display:grid;grid-template-columns:repeat(7, minmax(0,1fr));row-gap:2px">
          <sc-for list="{{ dow }}" as="w" hint-placeholder-count="7"><div style="text-align:center;font-family:Gaegu, cursive;font-size:15px;color:#A8988A;height:22px">{{ w }}</div></sc-for>
          <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
            <div onClick="{{ c.pick }}" style="position:relative;height:46px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer">
              <span style="font-family:Gaegu, cursive;font-weight:700;font-size:16px;line-height:20px;color:#48291A;padding:0 6px;border-radius:1000px;background:{{ c.selBg }};opacity:{{ c.op }}">{{ c.n }}</span>
              <span style="position:absolute;right:5px;top:2px;width:6px;height:6px;border-radius:1000px;background:{{ c.sch }}"></span>
              <span style="width:18px;height:18px;border-radius:48% 52% 50% 46%;background:{{ c.fill }}"></span>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="position:relative;margin:18px 16px 0;height:200px">
        <div style="position:absolute;left:0;top:0;width:256px;background:#FFFFFF;padding:12px 18px 14px;border-radius:22px 26px 20px 24px;box-shadow:0 4px 12px rgba(72,41,26,.10);transform:rotate(-1.5deg);box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
          <div style="font-family:Gaegu, cursive;font-weight:700;font-size:18px;color:#48291A">{{ selLabel }}</div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <span style="align-self:flex-start;font-family:Gaegu, cursive;font-weight:700;font-size:14px;color:#3F5A38;background:linear-gradient(transparent 55%, rgba(185,203,168,.7) 55%);padding:0 2px">일기</span>
            <span style="font-family:Gaegu, cursive;font-size:16px;line-height:1.3;color:#5E4535">{{ selBody2 }}</span>
          </div>
          <div style="height:0;border-top:1.5px dashed #E3D7C4"></div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <span style="align-self:flex-start;font-family:Gaegu, cursive;font-weight:700;font-size:14px;color:#9A4A3A;background:linear-gradient(transparent 55%, rgba(231,157,150,.45) 55%);padding:0 2px">일정</span>
            <sc-if value="{{ hasSched }}" hint-placeholder-val="{{ true }}">
              <sc-for list="{{ selSched }}" as="s" hint-placeholder-count="2">
                <div style="display:flex;align-items:center;gap:8px">
                  <span style="width:16px;height:16px;flex-shrink:0;border-radius:4px;background:{{ s.box }};box-shadow:inset 0 0 0 1.5px #48291A;display:flex;align-items:center;justify-content:center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#48291A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ s.check }}"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
                  <span style="font-family:Gaegu, cursive;font-size:16px;color:{{ s.col }};text-decoration:{{ s.deco }}">{{ s.t }}</span>
                </div>
              </sc-for>
            </sc-if>
            <sc-if value="{{ noSched }}" hint-placeholder-val="{{ false }}"><span style="font-family:Gaegu, cursive;font-size:15px;color:#A8988A">이 날은 일정이 없어요</span></sc-if>
          </div>
        </div>
        <div style="position:absolute;right:4px;bottom:0;width:120px;height:30px;background:rgba(169,190,140,.7);border-radius:40% 55% 45% 60% / 60% 50% 55% 45%;transform:rotate(-3deg)"></div>
        <div style="position:absolute;right:6px;bottom:-14px;width:116px;height:155px"><dc-import name="Baba" hat="none" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div>
      </div>
      <div style="position:absolute;left:16px;right:16px;bottom:104px;height:72px;border-radius:24px;background:rgba(251,248,241,.92);backdrop-filter:blur(20px);box-shadow:0 8px 24px rgba(72,41,26,.12), inset 0 0 0 1px rgba(72,41,26,.06);display:flex;align-items:center;gap:12px;padding:0 10px 0 16px">
        <span style="font-family:Gaegu, cursive;font-weight:700;font-size:17px;line-height:1.1;color:#48291A;text-align:center">이번 달<br>기록</span>
        <div style="flex:1;display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;border-radius:1000px;background:#F5CF5B"></span><span style="width:16px;height:16px;border-radius:1000px;background:#BDB8B1"></span><span style="width:16px;height:16px;border-radius:1000px;background:#9CB27E"></span><span style="font-family:Gaegu, cursive;font-weight:700;font-size:18px;color:#48291A;margin-left:4px">3일</span></div>
        <div style="display:flex;gap:2px;padding:3px;border-radius:1000px;background:#EFE6D3"><span style="height:40px;padding:0 12px;border-radius:1000px;background:#B9CBA8;display:flex;align-items:center;font-family:Gaegu, cursive;font-weight:700;font-size:16px;color:#48291A">달력</span><span style="height:40px;padding:0 12px;display:flex;align-items:center;font-family:Gaegu, cursive;font-weight:700;font-size:16px;color:#7A5A44">목록</span></div>
      </div>
      <dc-import name="PaperTabBar" selected="{{ 2 }}" floating="{{ true }}" hint-size="100%,96px" style="position:absolute;left:0;right:0;bottom:0"></dc-import>
    </div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sel: 13 };
  renderVals() {
    const dow = ['일', '월', '화', '수', '목', '금', '토'];
    const rec = {
      5: ['#F5CF5B', '행복', '친구랑 오랜만에 저녁을 먹었다. 웃을 일이 많았던 하루.'],
      9: ['#BDB8B1', '피곤', '야근이 길었다. 그래도 집에 와서 차 한 잔 마신 게 좋았다.'],
      13: ['#9CB27E', '평온', '잠깐 밖을 걸으며 마음이 조금 가벼워졌다.']
    };
    const sched = {
      3: [['병원 예약', true]], 8: [['팀 회의', true]], 13: [['아침 산책 20분', true], ['도서관 책 반납하기', true]],
      14: [['팀 회의 자료 정리', false], ['엄마한테 전화하기', false]], 17: [['친구 생일 선물 사기', false]], 22: [['치과 검진', false]], 28: [['월세 이체', false]]
    };
    const sel = this.state.sel, today = 14;
    const pick = d => () => this.setState({ sel: d });
    const cells = [];
    for (let i = 0; i < 35; i++) {
      const d = i - 3;
      if (d < 1 || d > 31) { cells.push({ n: '', fill: 'transparent', selBg: 'transparent', op: 1, rot: '0deg', word: '', noteBg: '#FBF6EA', sch: 'transparent', pick: () => {} }); continue; }
      const r = rec[d];
      cells.push({
        n: String(d), fill: r ? r[0] : 'transparent', word: r ? r[1] : (d === today ? '오늘' : ''),
        selBg: d === sel ? '#F6DE8A' : (d === today ? '#B9CBA8' : 'transparent'),
        noteBg: d === sel ? '#FBEFC4' : '#FFFDF7', op: d > today ? .4 : 1, sch: sched[d] ? '#E2765A' : 'transparent', rot: `${(d * 37) % 20 - 10}deg`, pick: pick(d)
      });
    }
    const r = rec[sel];
    const strip = [11, 12, 13, 14, 15, 16, 17].map((d, i) => ({ w: dow[i], n: String(d), fill: rec[d] ? rec[d][0] : '#E8DED0', selBg: d === sel ? '#F6DE8A' : 'transparent', pick: pick(d) }));
    const entries = [13, 9, 5].map(d => ({ n: String(d), w: dow[(d + 3) % 7], fill: rec[d][0], mood: rec[d][1], body: rec[d][2] }));
    const sel3 = this.state.sel3 ?? today;
    const cells3 = Array.from({ length: 35 }, (_, i) => {
      const d = i - 3;
      if (d < 1 || d > 31) return { n: '', bg: 'transparent', color: '#48291A', pick: () => {} };
      const isSel = d === sel3, isToday = d === today;
      return { n: String(d), bg: isSel ? '#5B7553' : (isToday ? '#F6DE8A' : 'transparent'), color: isSel ? '#FFFFFF' : '#48291A', pick: () => this.setState({ sel3: d }) };
    });
    return {
      dow, cells, cells3, strip, entries,
      selLabel: `10월 ${sel}일 ${dow[(sel + 3) % 7]}요일`,
      selTitle: r ? `${r[1]}한 하루` : '이 날은 기록이 없어요',
      selBody: r ? r[2] : '비어 있어도 괜찮은 날이에요.',
      selBody2: r ? r[2] : (sel === today ? '아직 오늘 일기를 쓰지 않았어요.' : '이 날은 일기가 없어요.'),
      selSched: (sched[sel] || []).map(([t, done]) => ({ t, box: done ? '#F6DE8A' : '#FFFFFF', check: done ? '1' : '0', deco: done ? 'line-through' : 'none', col: done ? '#A8988A' : '#48291A' })),
      hasSched: !!sched[sel], noSched: !sched[sel]
    };
  }
}
</script>
</body>
</html>
