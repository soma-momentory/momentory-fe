<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/tokens/fonts.css">
<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/tokens/colors.css">
<link rel="stylesheet" href="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<script src="_ds/ios-26-ui-kit-design-system-138099d6-44dc-4034-b75e-1d1d671d173e/_ds_bundle.js"></script>
<style>body{margin:0;background:#E6DDCC;font-family:var(--font-text, -apple-system, system-ui, sans-serif);} a{color:#48291A;} a:hover{color:#5B7553;}</style>
</helmet>
<div data-screen-label="5b 리포트 심플" style="width:402px;height:874px;border-radius:44px;overflow:hidden;position:relative;background-color:#F6F1E7;background-image:linear-gradient(#EAE2D3 1px, transparent 1px),linear-gradient(90deg,#EAE2D3 1px, transparent 1px);background-size:22px 22px;box-shadow:0 0 0 10px #1F1A15, 0 30px 60px rgba(0,0,0,.18)">
      <x-import component-from-global-scope="IOS26UIKitDesignSystem_138099.StatusBar" hint-size="100%,62px" style="position:relative"></x-import>
      <div style="position:relative;padding:4px 16px 0 22px;display:flex;justify-content:space-between;align-items:flex-start">
        <div style="position:relative">
          <div style="background:#E9D6BF;padding:4px 18px 8px 14px;transform:rotate(-3deg);clip-path:polygon(2% 10%, 8% 0, 30% 6%, 55% 0, 80% 5%, 98% 0, 100% 45%, 97% 100%, 70% 94%, 40% 100%, 12% 95%, 0 100%, 3% 50%)"><span style="font-family:Gaegu, cursive;font-weight:700;font-size:30px;color:#48291A;white-space:nowrap">이번 주</span></div>
          <div style="position:absolute;left:14px;bottom:-20px;background:#CDAE8A;padding:1px 12px;transform:rotate(-1deg);white-space:nowrap"><span style="font-family:Gaegu, cursive;font-weight:700;font-size:16px;color:#48291A">10.11 ~ 10.17</span></div>
        </div>
        <div style="display:flex"><span style="width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#48291A">‹</span><span style="width:40px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#B3A898">›</span></div>
      </div>
      <div style="position:relative;margin:40px 16px 0;height:120px">
        <div style="position:absolute;left:0;bottom:-10px;width:96px;height:124px;transform:rotate(-6deg);filter:drop-shadow(3px 0 0 #FFFFFF) drop-shadow(-3px 0 0 #FFFFFF) drop-shadow(0 3px 0 #FFFFFF) drop-shadow(0 -3px 0 #FFFFFF) drop-shadow(0 4px 5px rgba(72,41,26,.25))"><dc-import name="Baba" hat="none" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></div>
        <div style="position:absolute;left:100px;right:0;top:6px;background:#FFFFFF;border-radius:20px 24px 18px 22px;padding:12px 16px;box-shadow:0 4px 12px rgba(72,41,26,.10);transform:rotate(-1deg)">
          <div style="font-family:Gaegu, cursive;font-size:15px;color:#7A5A44">바바의 한 주 정리</div>
          <div style="font-family:Gaegu, cursive;font-weight:700;font-size:19px;line-height:1.25;color:#3A2114">평온한 날이 가장 많았어요. 피곤했던 월요일엔 쉼터에서 잘 쉬었네요.</div>
        </div>
      </div>
      <div style="position:relative;margin:40px 16px 0;padding:18px 10px 14px;background:#FBF8F1;border-radius:16px;box-shadow:0 6px 18px rgba(72,41,26,.08)">
        <div style="position:absolute;left:50%;top:-11px;width:84px;height:22px;margin-left:-42px;transform:rotate(-2deg);background:radial-gradient(rgba(255,255,255,.8) 2px, transparent 2.5px) 0 0/9px 9px, rgba(246,222,138,.85)"></div>
        <div style="padding:0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-family:Gaegu, cursive;font-weight:700;font-size:18px;color:#3A2114;white-space:nowrap">요일별</span>
          <div style="display:flex;gap:10px;font-family:Gaegu, cursive;font-size:13px;color:#6A4C38;white-space:nowrap">
            <span style="display:flex;align-items:center;gap:3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9A4A3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>완료한 일정</span>
            <span style="display:flex;align-items:center;gap:3px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#9CB27E" stroke="#5B7553" stroke-width="1.4"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7"></path></svg>쉼터에 들른 날</span>
          </div>
        </div>
        <div style="margin-top:10px;display:grid;grid-template-columns:repeat(7, minmax(0,1fr))">
          <sc-for list="{{ wk }}" as="d" hint-placeholder-count="7">
            <div style="display:flex;flex-direction:column;align-items:center;gap:5px;opacity:{{ d.op }}">
              <span style="font-family:Gaegu, cursive;font-weight:700;font-size:15px;color:#48291A;padding:0 6px;border-radius:1000px;background:{{ d.labelBg }}">{{ d.day }}</span>
              <span style="width:28px;height:28px;border-radius:48% 52% 50% 46%;background:{{ d.fill }};box-shadow:{{ d.ring }};transform:rotate({{ d.rot }})"></span>
              <span style="font-family:Gaegu, cursive;font-weight:700;font-size:13px;line-height:1;color:#3A2114;height:14px">{{ d.mood }}</span>
              <div style="width:100%;height:0;border-top:1.5px dashed #E3D7C4"></div>
              <span style="display:flex;align-items:center;gap:2px;font-family:Gaegu, cursive;font-weight:700;font-size:13px;color:#9A4A3A"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9A4A3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>{{ d.sch }}</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="#9CB27E" stroke="#5B7553" stroke-width="1.4" style="opacity:{{ d.rest }}"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14zM5 19l7-7"></path></svg>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="margin:34px 18px 0;display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:20px 16px">
        <sc-for list="{{ stats5 }}" as="s" hint-placeholder-count="4">
          <div style="position:relative;background:#FFFFFF;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:baseline;transform:rotate({{ s.rot }});box-shadow:0 0 0 1px #EDE4D4, 0 4px 8px rgba(72,41,26,.10)">
            <div style="position:absolute;left:50%;top:-8px;width:42px;height:16px;margin-left:-21px;background:{{ s.tape }}"></div>
            <span style="font-family:Gaegu, cursive;font-size:17px;color:#5E4535">{{ s.k }}</span>
            <span style="font-family:Gaegu, cursive;font-weight:700;font-size:26px;line-height:1;color:#3A2114">{{ s.v }}</span>
          </div>
        </sc-for>
      </div>
      <dc-import name="PaperTabBar" selected="{{ 3 }}" floating="{{ true }}" hint-size="100%,96px" style="position:absolute;left:0;right:0;bottom:0"></dc-import>
    </div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const fills = ['#9CB27E', '#BDB8B1', '#9CB27E', '#F28A3A', '#9CB27E', '#E8DED0', '#E8DED0'];
    const moods = ['평온', '피곤', '평온', '설렘', '평온', '', ''];
    const lines = ['산책하고 낮잠', '야근, 차 한 잔', '점심 혼밥이 좋았다', '새 프로젝트 시작', '잠깐 밖을 걸었다', '', ''];
    const lifts = ['-6px', '0px', '-10px', '-18px', '-14px', '-6px', '0px'];
    const wkFill = ['#9CB27E', '#BDB8B1', '#9CB27E', '#F28A3A', '#9CB27E', '#EFE6D6', '#EFE6D6'];
    const wkMood = ['평온', '피곤', '평온', '설렘', '평온', '', ''];
    const wkSch = ['1/1', '2/2', '1/2', '2/2', '1/2', '0/1', ''];
    const wkRest = [0, 1, 0, 1, 0, 0, 0];
    const wkRot = ['-6deg', '4deg', '-3deg', '7deg', '-5deg', '0deg', '0deg'];
    const wk = days.map((day, i) => ({
      day, date: String(11 + i), fill: wkFill[i], mood: wkMood[i] || '·', sch: wkSch[i] || '–', rest: wkRest[i] ? '1' : '0', rot: wkRot[i],
      op: i > 4 ? '.45' : '1', ring: i > 4 ? '0 0 0 2px #FFFFFF, inset 0 0 0 1.5px #D9CCB8' : '0 0 0 3px #FFFFFF, 0 2px 4px rgba(72,41,26,.2)',
      labelBg: i === 4 ? '#F6DE8A' : 'transparent'
    }));
    const tapes = [
      { k: '평온', n: '3일', w: '100%', bg: 'repeating-linear-gradient(90deg, rgba(156,178,126,.85) 0 6px, rgba(185,203,168,.85) 6px 12px)', r: '-1.5deg' },
      { k: '피곤', n: '1일', w: '42%', bg: 'radial-gradient(rgba(255,255,255,.7) 1.5px, transparent 2px) 0 0/8px 8px, rgba(189,184,177,.9)', r: '1deg' },
      { k: '설렘', n: '1일', w: '42%', bg: 'repeating-linear-gradient(45deg, rgba(242,138,58,.75) 0 5px, rgba(255,255,255,.5) 5px 10px)', r: '-1deg' },
      { k: '기록 없음', n: '2일', w: '64%', bg: 'rgba(233,214,191,.9)', r: '1.5deg' }
    ];
    const stats4 = [
      { k: '일기', v: '5편', rot: '-2deg', tape: 'rgba(246,222,138,.85)' },
      { k: '일정 완료', v: '7/10', rot: '1.5deg', tape: 'rgba(231,157,150,.6)' },
      { k: '쉼', v: '2번', rot: '-1deg', tape: 'rgba(170,190,225,.75)' }
    ];
    const stats5 = [
      { k: '일기', v: '5편', rot: '-2deg', tape: 'rgba(246,222,138,.85)' },
      { k: '일정 완료', v: '7/10', rot: '1.5deg', tape: 'rgba(231,157,150,.6)' },
      { k: '쉼', v: '2번', rot: '-1deg', tape: 'rgba(170,190,225,.75)' },
      { k: '바람카드', v: '2장', rot: '2deg', tape: 'rgba(185,203,168,.85)' }
    ];
    return {
      wk, tapes, stats4, stats5,
      week: days.map((day, i) => ({ day, fill: fills[i], mood: moods[i], line: lines[i] || '아직 기록 없음', lift: lifts[i], labelBg: i === 3 ? '#F6DE8A' : 'transparent', sep: i ? '0 -1px 0 #D9CCB8' : 'none' })),
      ratio: [{ k: '평온', n: 3, fill: '#9CB27E' }, { k: '피곤', n: 1, fill: '#BDB8B1' }, { k: '설렘', n: 1, fill: '#F28A3A' }, { k: '기록 없음', n: 2, fill: '#E8DED0' }],
      stats: [{ k: '일기', v: '5편', rot: '-2deg' }, { k: '일정', v: '9개', rot: '1.5deg' }, { k: '쉼', v: '2번', rot: '-1deg' }].map((s, i) => ({ ...s, sep: i ? '0 -1px 0 #EFE7DA' : 'none' }))
    };
  }
}
</script>
</body>
</html>
